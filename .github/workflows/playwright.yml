name: Playwright Test

on:
  push:
    branches: [ "playwright" ]
  pull_request:
    branches: [ "playwright" ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 👈 IMPORTANTE para Sonar (blame)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test
        continue-on-error: true   # 👈 permite que Sonar corra aunque fallen tests

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=fer8955_retoPlaywright \
            -Dsonar.organization=fer8955 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=. \
            -Dsonar.exclusions=**/node_modules/**,**/playwright-report/**,**/target/** \
            -Dsonar.tests=. \
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.spec.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./target/playwright-reports
          retention-days: 30